<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22F2A5" />
      <stop offset="100%" stop-color="#3DDCFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#22F2A5" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Terminal Border Window -->
  <rect x="8" y="8" width="104" height="104" rx="20" fill="#050B14" stroke="url(#logoGrad)" stroke-width="3" filter="url(#glow)" />
  <!-- Monogram ML in terminal style -->
  <path d="M 32 82 L 32 38 L 46 62 L 60 38 L 60 82" fill="none" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 72 38 L 72 82 L 92 82" fill="none" stroke="#3DDCFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Accent dot/prompt cursor -->
  <rect x="96" y="74" width="8" height="8" rx="2" fill="#22F2A5">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
